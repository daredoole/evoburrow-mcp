name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild node-pty
      - run: npm run coverage
      - run: npm run validate:release
      - run: npm run security:verify
      - run: npm run mcpb:build
      - name: Build package tarball
        run: npm pack --ignore-scripts
      - run: npm sbom --sbom-format cyclonedx > evoburrow-sbom.json
      - run: sha256sum evoburrow-mcp-*.tgz dist/evoburrow-mcp-*.mcpb evoburrow-sbom.json > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            evoburrow-mcp-*.tgz
            dist/evoburrow-mcp-*.mcpb
            evoburrow-sbom.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" evoburrow-mcp-*.tgz dist/evoburrow-mcp-*.mcpb evoburrow-sbom.json SHA256SUMS --verify-tag --generate-notes --title "$GITHUB_REF_NAME" --prerelease
